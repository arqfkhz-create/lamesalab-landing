<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamesalab - Marketing para negocios de comida en Puerto Rico y Buenos Aires</title>
    <meta name="facebook-domain-verification" content="fmfldtvb08dcl7pjgyxczxnsyrc61b" />

  
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
        theme: {
            extend: {
            colors: {
             ink:    { DEFAULT: '#44403c', soft: '#292524' },
                cream:  '#f6f7f2', 
                sand:   '#f0e9df',
                clay:   { DEFAULT: '#F4320B', dark: '#a1501f', light: '#ca8a04' },
                sage:   { DEFAULT: '#3f6b5e', dark: '#2f5248' },
            },
            fontFamily: {
                sans: ['"Roboto Slab"', 'Georgia', 'sans-serif'],
                display: ['"Fraunces"', 'Georgia', 'serif'],
            },
        },
      },
    };
    </script>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">

    <style>
        html { scroll-behavior: smooth; }
        .fade-in { opacity: 0; transform: translateY(16px); transition: opacity .6s ease, transform .6s ease; }
        .fade-in.visible { opacity: 1; transform: translateY(0); }
    </style>

</head>
<body class="bg-cream text-ink font-sans antialiased">
  
<header class="sticky top-0 z-40 bg-sand/40 backdrop-blur border-b border-sand">
  <nav class="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between">
    <a href="/"><img src="/imgs/lamesalab-logo-cut.png" alt="logo lamesalab" class="h-10 w-auto"></a>

    <!-- Menú de escritorio (desde 1024 px) -->
    <div class="hidden lg:flex items-center gap-8 text-sm font-medium text-ink-soft">
      <a href="/servicios" class="hover:text-clay transition-colors">Servicios</a>
      <div class="relative group">
      <a href="/recursos/" class="inline-flex items-center gap-1 hover:text-clay transition-colors">
        Recursos
        <svg class="w-3 h-3 transition-transform group-hover:rotate-180" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/>
        </svg>
      </a>

      <div class="absolute left-0 top-full pt-3 hidden group-hover:block group-focus-within:block">
        <div class="w-56 bg-white border border-sand rounded-md shadow-md py-2">
          <a href="/recursos/evaluacion/" class="block px-4 py-2 hover:bg-sand hover:text-clay transition-colors">Evaluación gratuita</a>
          <a href="/recursos/blog/" class="block px-4 py-2 hover:bg-sand hover:text-clay transition-colors">Blog</a>
        </div>
      </div>
    </div>
      <a href="/quienes-somos" class="hover:text-clay transition-colors">Quienes Somos</a>
      <a href="/faq" class="hover:text-clay transition-colors">FAQ</a>
      <a href="/diagnostico/#diagnostico" class="rounded-md bg-clay hover:bg-clay-dark text-white font-semibold px-5 py-2.5 transition-colors">Diagnóstico gratis</a>
    </div>

    <!-- Botón hamburguesa (celular y iPad) -->
    <button id="menu-btn" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu-movil"
            class="lg:hidden p-2 -mr-2 text-ink-soft">
      <svg id="icono-abrir" class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
      <svg id="icono-cerrar" class="w-7 h-7 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </nav>

  <!-- Menú desplegable (celular y iPad) -->
  <div id="menu-movil" class="hidden lg:hidden border-t border-sand bg-cream">
    <div class="max-w-6xl mx-auto px-5 py-4 flex flex-col text-ink-soft font-medium">
      <a href="/servicios/" class="py-3 border-b border-sand">Servicios</a>
      <a href="/recursos/" class="pt-3 pb-1">Recursos</a>
        <div class="flex flex-col pl-4 pb-2 text-sm border-b border-sand">
          <a href="/recursos/evaluacion/" class="py-2">Evaluación gratuita</a>
          <a href="/recursos/blog/" class="py-2">Blog</a>
        </div>
      <a href="/quienes-somos/" class="py-3 border-b border-sand">Quienes Somos</a>
      <a href="/faq/" class="py-3 border-b border-sand">FAQ</a>
      <a href="/diagnostico/#diagnostico" class="mt-4 rounded-md bg-clay hover:bg-clay-dark text-white font-semibold px-5 py-3 text-center transition-colors">Diagnóstico gratis</a>
    </div>
  </div>
</header>

  <section id=blog class="bg-sand/40 py-12">
  <div class="max-w-6xl mx-auto bg-sage rounded-3xl border border-sand p-7 shadow-md">
    <div class="max-w-2xl mb-12">
      <span class="text-sm text-white mb-3 uppercase">Recursos</span>
      <h2 class="font-display text-3xl md:text-4xl font-600 tracking-tight mt-2 text-white">Articulos Recientes.</h2>
    </div>
    <div class="flex justify-end gap-3 mb-6">
      <button id="blog-anterior" type="button" aria-label="Artículos anteriores" class="w-11 h-11 rounded-full border border-ink/20 text-ink text-xl hover:bg-white disabled:opacity-30 disabled:cursor-default">←</button>
      <button id="blog-siguiente" type="button" aria-label="Más artículos" class="w-11 h-11 rounded-full border border-ink/20 text-ink text-xl hover:bg-white disabled:opacity-30 disabled:cursor-default">→</button>
    </div>
    <div id="lista-blog" class="flex gap-8 overflow-x-auto snap-x snap-mandatory pb-4 [scrollbar-width:none]"></div>
    <script src="/js/posts.js"></script>
  </div>
</section>

  <!-- ==================== FOOTER ==================== -->
<footer class="bg-sand/40 border-t border-sand">
  <div class="max-w-6xl mx-auto px-5 py-6 flex flex-col md:flex-column items-center justify-center">
    <div>
      <img src="../../imgs/lamesalab-logo.png" class="h-80 w-auto" alt="logo lamesalab">
    </div>
  </div>
  <div class="text-center text-xs text-ink-soft/60 pb-8">© <span id="year"></span> lamesalab. Todos los derechos reservados.</div>
</footer>

</body>
